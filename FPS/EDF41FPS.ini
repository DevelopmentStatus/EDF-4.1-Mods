[FPS]
Enabled=1
; C or F6 toggles on foot while the game has focus. Restart to reload settings.
; Hold the left stick click (L3) for 0.7 seconds; release before toggling again.
; Options: LeftStick, RightStick, BothSticks, Off. Existing game bindings still act.
ControllerToggle=LeftStick
ControllerHoldMs=700
; XInput slot: 0 is the first controller; valid values 0 through 3.
ControllerIndex=0
; All four shipped classes use kubi. Blank auto-detects, preferring kubi.
; If resolution fails, copy the exact bone name from EDF41FPS.log here.
HeadBone=kubi
DumpBones=1
; Suppress head/helmet/hair material draws for the local first-person body.
; Covers all four classes, including pieces outside the head-bone hierarchy.
HideHeadMaterials=1

; World units. Camera follows animated head position, preserves mouse orientation.
EyeForward=0.025
EyeUp=0.15
LookDownForward=0.20
LookDownStartDegrees=20
LookDownEndDegrees=75
LookDownSmoothing=12

; Head and descendants collapse around the head pivot for rendering only.
HeadScale=0.001
NearClip=0.035
; Vertical degrees; relative weapon zoom is preserved. 0 keeps game FOV.
VerticalFov=65
