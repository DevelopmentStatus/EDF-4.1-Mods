[FPS]
Enabled=1
; C or F6 toggles on foot or in vehicles while the game has focus. Restart to reload settings.
; Hold the left stick click (L3) for 0.7 seconds; release before toggling again.
; Options: LeftStick, RightStick, BothSticks, Off. Existing game bindings still act.
ControllerToggle=LeftStick
ControllerHoldMs=700
; XInput slot: 0 is the first controller; valid values 0 through 3.
ControllerIndex=0
; All four shipped classes use kubi. Blank auto-detects, preferring kubi.
; If resolution fails, copy the exact bone name from EDF41FPSVehicles.log here.
HeadBone=kubi
DumpBones=1
; Suppress head/helmet/hair material draws for the local first-person body.
; Covers all four classes, including pieces outside the head-bone hierarchy.
HideHeadMaterials=1

; World units. Camera follows animated head position, preserves mouse orientation.
EyeForward=0.025
EyeUp=0.15
LookDownForward=0.20
LookDownStartDegrees=20
LookDownEndDegrees=75
LookDownSmoothing=12

; Head and descendants collapse around the head pivot for rendering only.
HeadScale=0.001
NearClip=0.035
; Vertical degrees; relative weapon zoom is preserved. 0 keeps game FOV.
VerticalFov=65

; Vehicle variant: bikes stay opaque; enclosed occupied hulls fade in first person.
; Opacity: 0 invisible, 0.25 quarter opacity, 1 opaque.
VehicleOpacity=0.25
; Driver view follows the animated head with EyeUp / EyeForward above.
; Grape passenger seats retain their native camera and ordinary hull rendering.

; Roll the camera and eye offsets with the vehicle through walls and ceilings.
; 0 restores the old world-level horizon; native aiming controls are preserved.
VehicleRelativeOrientation=1

; Mechs use their animated vehicle camera node near the cockpit.
; 0 restores the hidden infantry pilot head used by older versions.
MechCockpitCamera=1
; Offsets from the cockpit node, following vehicle up and facing directions.
MechCockpitUp=0.15
MechCockpitForward=0.20
